[package]
name = "miomail"
version = "2.1.12"
edition = "2021"
homepage = "https://miomail.app/"
repository = "https://github.com/firemio/miomail"

[lib]
name = "miomail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "miomail"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
async-imap = "0.10"
async-native-tls = "0.5"
async-std = "1"
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = ["tokio1-native-tls", "builder", "smtp-transport"] }
mail-parser = "0.9"
base64 = "0.22"
keyring = { version = "3", features = ["windows-native"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
once_cell = "1"
# CPU 名の取得(mail_system_info 用。x86/x86_64 のみ有効、他アーチは "不明")
raw-cpuid = "11"
# キャラクターMODアーカイブ(zip / tar.xz)の展開。いずれも純Rust実装
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
lzma-rs = "0.3"
# --- セマンティック検索(embed.rs / vectorize.rs)用 ---
# ort: ONNX Runtime バインディング。`load-dynamic` で onnxruntime.dll を実行時ロード
# するため、リンク時に DLL は不要(protoc も不要)。指す DLL は新 Windows ML
# (Windows App SDK 同梱の ONNX Runtime 1.24 系)で、`GetEpDevices` /
# `AutoDevicePolicy` による EP 自動選択(NPU > GPU > CPU)を利用する。
# NPU 向け EP(Intel=OpenVINO / AMD=VitisAI)は WinML の EP カタログが実行時に
# 供給・登録するため、コンパイル時同梱(旧 npu feature)は行わない。
# `api-24` は新しい Windows ML(Windows App SDK 2.x 同梱の ONNX Runtime 1.24 系)に
# 合わせた EP-device API を有効化する。ターゲットは WinML 同梱 ORT 1.24 のみ。
ort = { version = "=2.0.0-rc.12", default-features = false, features = [
    "std",
    "ndarray",
    "load-dynamic",
    "api-24",
] }
# トークナイザ(tokenizer.json をローカル読み込み。http 機能は不要)
tokenizers = { version = "=0.23.1", default-features = false, features = ["fancy-regex"] }
# モデルの手動ダウンロード(hf-hub の代わり。バイナリサイズと依存削減)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

[features]
default = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
