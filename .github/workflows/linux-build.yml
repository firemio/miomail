name: Linux build

# 開発機が Windows なので、Linux 版はここでしかビルド・検証できない。
# Windows 版のリリース(scripts/release.ps1)とは独立して動く。
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/linux-build.yml'

permissions:
  contents: write # リリース公開時に成果物を添付する

jobs:
  build:
    # 古い glibc で作ると新しい Ubuntu / Debian でも動く。
    # このイメージは 2027-04-17 に廃止されるので、それまでに ubuntu-24.04 へ上げる。
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: システムライブラリ
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            curl wget file patchelf

      # このリポジトリは lockfile を持たない(Windows 側のビルドも同じ)ので、
      # npm のキャッシュも npm ci も使えない
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm install --no-audit --no-fund

      - name: 型チェック
        run: npm run typecheck

      - name: i18n テスト
        run: npm run test:i18n

      - name: Rust テスト
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: 資格情報ストアの保存・読み出し
        # Linux の保存先は2段構え(secret-service → カーネルキーリング)。
        # ランナーに GNOME キーリングは無いので、これは退避側の経路を通る。
        # YAML の plain scalar に ': ' は書けない(credentials:: が衝突する)
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib credentials:: -- --ignored

      - name: パッケージ作成
        # bundle.targets は src-tauri/tauri.linux.conf.json 側で deb と appimage を指定。
        # 自動更新用の成果物(.sig)は署名鍵が要る。鍵が無いリポジトリでもビルド自体は
        # 通るよう、そのときだけ createUpdaterArtifacts を落とす。
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run tauri -- build
          else
            echo "署名鍵が無いので、自動更新用の成果物は作りません"
            npm run tauri -- build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: 中身の確認
        run: |
          ls -R src-tauri/target/release/bundle
          dpkg -c src-tauri/target/release/bundle/deb/*.deb

      - name: ブラウザから使えるか(miomail --serve の煙テスト)
        # Muse ではこの経路しか使えないので、実機で動くことをここで確かめる。
        # 画面は tauri/custom-protocol が有効なときだけ実行ファイルへ埋め込まれる。
        # 素の cargo build で作ると画面が空になるため、その取り違えもここで落とす。
        run: |
          export MIOMAIL_DB="$PWD/smoke-test.db"
          src-tauri/target/release/miomail --serve --port 7272 --token smoketoken >serve.log 2>&1 &
          serve_pid=$!
          trap 'kill $serve_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null "http://127.0.0.1:7272/?t=smoketoken" && break
            sleep 1
          done
          cat serve.log
          # 画面が埋め込まれていること(0件ならここまで来ずに起動が止まる)
          curl -sf "http://127.0.0.1:7272/?t=smoketoken" | grep -q "__miomail/bridge.js"
          # 合言葉が無ければ開けないこと
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:7272/")" = "401"
          # コマンドが通ること(アカウント0件でも ok:true が返る)
          curl -sf -H "X-MioMail-Token: smoketoken" -H "Content-Type: application/json" \
            -d '{"cmd":"account_list"}' "http://127.0.0.1:7272/__miomail/invoke" | grep -q '"ok":true'

          # --- Muse のスペース用: 1ファイル完結の画面 ---
          curl -sf "http://127.0.0.1:7272/__miomail/standalone.html?t=smoketoken" >standalone.html
          grep -q "standalone:true" standalone.html
          # 画面の本体は「ブラウザーが実行しない型」の札で運ぶ。枠に入れられて親の CSP を
          # 引き継いでも、親から差し込めば起動できるようにするため。
          grep -q 'type="application/miomail-module"' standalone.html
          # 札を取り出して走らせる役が入っていること
          grep -q "__MIOMAIL_STARTED__" standalone.html
          # 差し込まれたスクリプトを自分のポリシーでも通すこと(両方の CSP が効くため)
          grep -q "strict-dynamic" standalone.html
          # 動くスクリプトとして素のまま埋めていないこと(型を外すと親の CSP に殺される)
          ! grep -q '<script type="module" nonce=' standalone.html
          # 外部ファイルを参照していないこと(枠の中からは取りに行けない)
          ! grep -q 'src="./assets/' standalone.html
          ! grep -q 'href="./assets/' standalone.html
          # 画面の設定を預かり、次に開くときに埋めて返すこと
          curl -sf -H "X-MioMail-Token: smoketoken" -H "Content-Type: application/json" \
            -d '{"cmd":"__settings_set","args":{"key":"smoke","value":"1"}}' \
            "http://127.0.0.1:7272/__miomail/invoke" | grep -q '"ok":true'
          curl -sf "http://127.0.0.1:7272/__miomail/standalone.html?t=smoketoken" | grep -q '"smoke":"1"'
          # SSE を張れない枠のための、イベントを取りに行く口
          curl -sf -H "X-MioMail-Token: smoketoken" -H "Content-Type: application/json" \
            -d '{"cmd":"__events_poll","args":{"since":0}}' \
            "http://127.0.0.1:7272/__miomail/invoke" | grep -q '"events"'
          kill $serve_pid
          trap - EXIT

          # --- スペースと同じ起動の仕方 ---
          src-tauri/target/release/miomail --serve --port 7273 --single-file --no-token >serve-space.log 2>&1 &
          space_pid=$!
          trap 'kill $space_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null "http://127.0.0.1:7273/" && break
            sleep 1
          done
          cat serve-space.log
          curl -sf "http://127.0.0.1:7273/" | grep -q "standalone:true"
          # --no-token は 127.0.0.1 のときだけ。他のアドレスでは起動を断る
          ! src-tauri/target/release/miomail --serve --host 0.0.0.0 --no-token
          echo "--serve は動いています"

      - name: 固定名のコピーを作る
        run: |
          mkdir -p dist-linux
          cp src-tauri/target/release/bundle/deb/*.deb dist-linux/MioMail-amd64.deb
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist-linux/MioMail-x86_64.AppImage
          # 自動更新用の署名(鍵があるときだけ作られる)
          if ls src-tauri/target/release/bundle/appimage/*.AppImage.sig >/dev/null 2>&1; then
            cp src-tauri/target/release/bundle/appimage/*.AppImage.sig dist-linux/MioMail-x86_64.AppImage.sig
          fi
          ls -l dist-linux

      - uses: actions/upload-artifact@v4
        with:
          name: miomail-linux
          path: dist-linux/*

      - name: リリースへ添付
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist-linux/* --clobber

      - name: 自動更新のlatest.jsonにLinuxを足す
        # Windows のリリース時に作られた latest.json に、AppImage の項目を足す。
        # これが無いと Linux 版は更新先を見つけられない。
        # 予行演習(prerelease)では触らない。自動更新の宛先を試作版へ向けてしまうため。
        if: github.event_name == 'release' && !github.event.release.prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "署名鍵が無いので latest.json は触りません(Linux の自動更新は無効のまま)"
            exit 0
          fi
          tag="${{ github.event.release.tag_name }}"
          gh release download "$tag" --pattern latest.json --dir . --clobber
          node scripts/add-linux-to-latest-json.mjs \
            --manifest latest.json \
            --appimage dist-linux/MioMail-x86_64.AppImage \
            --tag "$tag"
          gh release upload "$tag" latest.json --clobber
